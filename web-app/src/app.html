<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#e8e8ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)" />
		<script>
			// Set light or dark before the first paint so the page never flashes.
			try {
				const saved = localStorage.getItem('oplan-theme');
				const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
